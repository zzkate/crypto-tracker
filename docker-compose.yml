services:
  app:
    build: .
    # Все переменные приложения берутся из .env (локально/Docker),
    # а в CI/GitHub Actions те же имена приходят из secrets -> env.
    env_file:
      - .env
    environment:
      PORT: 3000
      DB_PATH: /data/crypto.db
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - crypto-data:/data
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  crypto-data:
