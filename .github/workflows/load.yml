name: Load test

on:
  workflow_dispatch:
    inputs:
      concurrency:
        description: 'Одновременных запросов'
        required: false
        default: '50'
      duration:
        description: 'Длительность, секунды'
        required: false
        default: '10'
      endpoint:
        description: 'Эндпоинт (например /api/coins, /api/prices/latest)'
        required: false
        default: '/api/coins'
      mode:
        description: 'single или sweep (поиск максимума конкурентности)'
        required: false
        default: 'single'
      method:
        description: 'HTTP-метод (GET/POST)'
        required: false
        default: 'GET'
      body:
        description: 'Тело для POST/PUT/PATCH, JSON с {{n}} (например {"symbol":"W{{n}}","name":"Coin {{n}}"})'
        required: false
        default: ''
      sweep_end:
        description: 'Верхняя граница конкурентности для sweep'
        required: false
        default: '300'

jobs:
  load:
    name: Load test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start server (без CMC)
        env:
          PORT: '3000'
          APP_API_KEY: 'load-test-key'
          CMC_API_KEY: ''
          DB_PATH: '/tmp/load.db'
        run: |
          node --disable-warning=ExperimentalWarning dist/server.js >/tmp/load-server.log 2>&1 &
          echo $! >/tmp/load-server.pid

      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://127.0.0.1:3000/health; then exit 0; fi
            sleep 0.2
          done
          echo "server did not start"
          cat /tmp/load-server.log
          exit 1

      - name: Run load
        env:
          APP_API_KEY: 'load-test-key'
          BASE_URL: 'http://127.0.0.1:3000'
          CONCURRENCY: ${{ inputs.concurrency }}
          DURATION_SECONDS: ${{ inputs.duration }}
          ENDPOINT: ${{ inputs.endpoint }}
          MODE: ${{ inputs.mode }}
          METHOD: ${{ inputs.method }}
          BODY: ${{ inputs.body }}
          SWEEP_END: ${{ inputs.sweep_end }}
        run: node scripts/load-test.mjs | tee load-results.txt

      - name: Render job summary
        if: always()
        run: |
          if [ -f load-summary.md ]; then
            cat load-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-results
          path: |
            load-results.txt
            load-summary.md
          if-no-files-found: ignore

      - name: Stop server
        if: always()
        run: kill "$(cat /tmp/load-server.pid)" 2>/dev/null || true
